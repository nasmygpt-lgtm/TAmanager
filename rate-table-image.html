<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rate Table → JPEG</title>
<style>
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#0b2545;color:#fff;text-align:center;padding:24px}
  h2{margin:0 0 6px}
  p{color:#bcd7ee;margin:0 0 18px;font-size:14px}
  canvas{background:#fff;border-radius:12px;max-width:100%;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .btns{margin:18px 0}
  button{background:#0ea5e9;color:#fff;border:none;padding:11px 20px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin:0 6px}
  button:hover{background:#0369a1}
  .hint{color:#bcd7ee;font-size:13px;margin-top:10px}
</style>
</head>
<body>
  <h2>📄 Grand Central Hotel — Deluxe Room Rates</h2>
  <p>Your rate table as an image. Click the button to save it as JPEG.</p>
  <canvas id="c" width="900" height="356"></canvas>
  <div class="btns">
    <button id="dlJpg">⬇️ Download JPEG</button>
    <button id="dlPng">⬇️ Download PNG</button>
  </div>
  <p class="hint">On a phone, if the button doesn't save, long-press the image and choose “Save image”.</p>

<script>
const data = {
  title: "Grand Central Hotel — Deluxe Room Rates",
  headers: ["Period", "Rate (AED)", "Tourism Fee", "Extra Bed"],
  rows: [
    ["OCT 1-15",  "AED 240", "AED 15 TD", "AED 120"],
    ["OCT 16-31", "AED 250", "AED 15 TD", "AED 130"],
    ["NOVEMBER",  "AED 285", "AED 15 TD", "AED 130"]
  ],
  currency: "Currency: AED"
};

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

function draw(){
  const W = cv.width, H = cv.height;
  const navy = "#0b2545", blue = "#1e3a8a", light = "#f5f8fc", ink = "#1e293b", gold="#f59e0b";
  const cols = data.headers.length;
  const marginX = 30, tableTop = 120;
  const tableW = W - marginX*2;
  const colW = tableW / cols;
  const rowH = 54, headH = 56;

  // background
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,H);

  // title bar
  ctx.fillStyle = navy; ctx.fillRect(marginX, 24, tableW, 66);
  ctx.fillStyle = gold; ctx.fillRect(marginX, 24, 8, 66);
  ctx.fillStyle = "#fff"; ctx.font = "bold 24px Segoe UI, Arial";
  ctx.textBaseline = "middle";
  ctx.fillText(data.title, marginX+24, 50);
  ctx.font = "13px Segoe UI, Arial"; ctx.fillStyle = "#bcd7ee";
  ctx.fillText(data.currency + "   ·   " + new Date().toLocaleDateString(), marginX+24, 74);

  // header row
  ctx.fillStyle = blue;
  ctx.fillRect(marginX, tableTop, tableW, headH);
  ctx.fillStyle = "#fff"; ctx.font = "bold 15px Segoe UI, Arial"; ctx.textAlign="center";
  data.headers.forEach((h,i)=> ctx.fillText(h, marginX + colW*i + colW/2, tableTop + headH/2));

  // data rows
  data.rows.forEach((r,ri)=>{
    const y = tableTop + headH + ri*rowH;
    ctx.fillStyle = ri%2 ? "#eef4fb" : light;
    ctx.fillRect(marginX, y, tableW, rowH);
    r.forEach((cell,ci)=>{
      ctx.fillStyle = ci===0 ? navy : ink;
      ctx.font = ci===0 ? "bold 15px Segoe UI, Arial" : "15px Segoe UI, Arial";
      ctx.fillText(cell, marginX + colW*ci + colW/2, y + rowH/2);
    });
  });

  // grid lines
  ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1;
  const totalH = headH + data.rows.length*rowH;
  for(let i=0;i<=cols;i++){ ctx.beginPath(); ctx.moveTo(marginX+colW*i, tableTop); ctx.lineTo(marginX+colW*i, tableTop+totalH); ctx.stroke(); }
  for(let i=0;i<=data.rows.length+1;i++){ const yy=tableTop+ (i===0?0: headH + (i-1)*rowH); ctx.beginPath(); ctx.moveTo(marginX,yy); ctx.lineTo(marginX+tableW,yy); ctx.stroke(); }
  ctx.strokeRect(marginX, tableTop, tableW, totalH);

}
draw();

function download(type, ext){
  const url = cv.toDataURL(type, 0.95);
  const a = document.createElement("a");
  a.href = url; a.download = "grand-central-rates." + ext; a.click();
}
document.getElementById("dlJpg").onclick = ()=> download("image/jpeg","jpg");
document.getElementById("dlPng").onclick = ()=> download("image/png","png");
</script>
</body>
</html>
